name: astrbot_plugin_steam_price
display_name: Steam游戏价格查询
short_desc: 支持通过 /steam 指令或 AI 自然语言查询 Steam 国区游戏价格、折扣、封面图与商店链接
desc: |
  一个专为 AstrBot 打造的 Steam 游戏国区（CNY）价格查询插件。
  
  特性：
  - 🤖 **AI 工具支持 (@filter.llm_tool)**：用户用自然语言询问（如“黑神话现在多少钱”、“赛博朋克打折了吗”），大模型可自动调用工具查询。
  - 💬 **指令直达 (@filter.command)**：支持 `/steam <游戏名>` 快捷查询。
  - 🖼️ **图文混排**：通过 AstrBot 消息链组件在聊天窗口（QQ/微信/TG等）直接发送游戏封面胶囊图与价格信息。
  - 💰 **精准解析**：自动换算分到元、识别免费游戏 (Free to Play)、计算打折幅度并附带商店直达链接。
version: 1.0.0
author: AstrBot-User
repo: https://github.com/your-name/astrbot_plugin_steam_price
astrbot_version: ">=4.13.0"
